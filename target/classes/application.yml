server:
  port: 8080

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

# NOTE: there is deliberately no "providers" tree here any more. LP hosts,
# comp IDs and credentials belong to the caller and arrive on each gRPC request
# as an LpSessionSpec. Everything below is gateway-wide behaviour only.
fix-gateway:
  grpc:
    port: 9090
    order-timeout-ms: 10000
    # This port carries LP FIX passwords. Enable mTLS in every environment that
    # reaches a real LP; plaintext is for loopback development only.
    tls:
      enabled: ${LP_HEDGE_GRPC_TLS_ENABLED:false}
      cert-chain-path: ${LP_HEDGE_GRPC_TLS_CERT:}
      private-key-path: ${LP_HEDGE_GRPC_TLS_KEY:}
      trust-cert-collection-path: ${LP_HEDGE_GRPC_TLS_CA:}
      require-client-auth: true

  session:
    # Kept under the caller's RPC deadline so a slow logon surfaces as an error
    # rather than as a timeout with no explanation.
    #
    # 8s was too tight for a real venue: a first logon over TLS to an
    # institutional LP routinely takes longer, and when this expires
    # awaitLogon() tears the socket down - which shows up in the FIX event log
    # as "Encountered END_OF_STREAM" and reads exactly like the LP rejecting
    # us, when in fact we hung up on them first. Raise the caller's deadline
    # (LP_HEDGE_GRPC_TIMEOUT_MS on the Node side) alongside this.
    logon-timeout-seconds: ${FIX_LOGON_TIMEOUT_SECONDS:25}
    idle-timeout-minutes: 30
    reaper-interval-ms: 60000
    file-store-path: data/store
    file-log-path: data/log

  # Replay buffer for execution reports, so nothing the venue says about an
  # order is lost between arriving and the caller recording it. Deliberately
  # bounded: the durable execution ledger belongs to the caller, not here.
  execution-journal:
    retention-minutes: 120
    max-reports: 20000
    max-reports-per-order: 200
    sweep-interval-ms: 60000

  pipeline:
    inbound-queue-capacity: 10000
    outbound-queue-capacity: 5000
    overflow-strategy: DROP_OLDEST

  persistence:
    mode: in-memory   # in-memory | jdbc

  resilience:
    circuit-breaker:
      failure-rate-threshold: 50
      wait-duration-in-open-state: 30s
    retry:
      max-attempts: 3
      backoff-ms: 200
