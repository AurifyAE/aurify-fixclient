syntax = "proto3";

package aurify.lphedge.v1;

option java_multiple_files = true;
option java_package = "aurify.lphedge.v1";
option java_outer_classname = "LpHedgeGatewayProto";

service LpHedgeGateway {
  // Submit a market order. If no live FIX session exists for the LP account in
  // `session`, the gateway logs on first, then sends the order.
  rpc SubmitMarketOrder (SubmitMarketOrderRequest) returns (SubmitMarketOrderResponse);

  // Establish (or verify) a FIX session without sending an order. Useful as a
  // "test connection" action when an LP is created/edited in the CRM.
  rpc EnsureSession (EnsureSessionRequest) returns (SessionStatusResponse);

  // Report the current session state for an LP account without changing it.
  rpc GetSessionStatus (SessionStatusRequest) returns (SessionStatusResponse);

  // Log out and drop a session. The next order recreates it.
  rpc CloseSession (CloseSessionRequest) returns (SessionStatusResponse);

  // Every execution report the gateway sees, as it sees it.
  //
  // SubmitMarketOrder answers with what was known when the RPC completed; an
  // LP keeps talking about an order after that (further partial fills, a late
  // correction, the resolution of an order that timed out). The caller owns the
  // execution ledger, so it subscribes here and records the rest itself.
  rpc StreamExecutionReports (StreamExecutionReportsRequest) returns (stream ExecutionReport);

  // Everything the journal still holds for one order. Lets the caller backfill
  // an order it has no complete record of without waiting for a live report.
  rpc GetOrderExecutions (GetOrderExecutionsRequest) returns (GetOrderExecutionsResponse);
}

// One FIX session's connection parameters. Carries credentials, so this
// contract REQUIRES mTLS on the gRPC channel.
message FixSession {
  string host = 1;
  int32  port = 2;
  string sender_comp_id = 3;
  string target_comp_id = 4;
  string username = 5;
  string password = 6;
  bool   use_ssl = 7;
  bool   reset_seq_num_on_logon = 8;
  int32  heartbeat_interval_seconds = 9;
  string server_name = 10;              // SNI / SSL peer name, optional
  string start_time = 11;               // FIX session window, default 00:00:00
  string end_time = 12;                 // FIX session window, default 23:59:59
}

// Everything the gateway needs to talk to one liquidity provider account.
// The caller (Node) owns this data; the gateway holds no LP config of its own.
message LpSessionSpec {
  string lp_account_id = 1;             // stable key: identifies the session
  string provider = 2;                  // adapter selector, e.g. "fxcubic"
  string fix_version = 3;               // e.g. "FIX.4.3"
  FixSession trading = 4;
  repeated string allowed_symbols = 5;  // replaces any gateway-side symbol list
  int64  max_order_size = 6;
  double max_position_per_symbol = 7;
  double max_total_exposure = 8;
  string spec_fingerprint = 9;          // caller-computed; change forces relogon

  // The account identifier AT THE LIQUIDITY PROVIDER, sent as FIX tag 1.
  // Not lp_account_id: that is our own key and means nothing to the venue.
  // Left empty, tag 1 is omitted rather than filled with something the LP
  // will reject.
  string account = 10;

  // NewOrderSingle PartyID (tag 448) - required by providers that mandate a
  // NoPartyIDs group (e.g. Finalto). Left empty, the group is omitted.
  string party_id = 11;
}

message SubmitMarketOrderRequest {
  reserved 4;                           // was lp_api_key; never send credentials per-order
  reserved "lp_api_key";

  string idempotency_key = 1;
  string order_id = 2;
  string lp_account_id = 3;
  string symbol = 5;
  string side = 6;
  int64  quantity = 7;
  string order_type = 8;
  string organization_id = 9;
  string branch_id = 10;
  string correlation_id = 11;
  LpSessionSpec session = 12;           // required
  string time_in_force = 13;            // IOC | FOK | GTC | DAY; empty = provider default (IOC)
}

message SubmitMarketOrderResponse {
  bool   success = 1;
  string cl_ord_id = 2;
  string order_id = 3;
  string status = 4;
  double avg_px = 5;
  double cum_qty = 6;
  double leaves_qty = 7;
  bool   terminal = 8;
  string error_code = 9;
  string error_message = 10;

  // Every report seen for this order while the call was open, in arrival order
  // - the intermediate acknowledgements as well as the one that completed it.
  // Fields 2-8 stay as the summary of the last of them, so an existing caller
  // that ignores this keeps working.
  repeated ExecutionReport reports = 11;
}

// One FIX ExecutionReport, provider-neutral. The unit of the caller's
// execution ledger: exec_id identifies it uniquely within an order, which is
// what makes recording it idempotent across a replay or a reconnect.
message ExecutionReport {
  string lp_account_id = 1;
  string provider = 2;
  string cl_ord_id = 3;
  string order_id = 4;
  string exec_id = 5;
  string exec_type = 6;                 // NEW | PENDING_NEW | FILL | REJECTED | CANCELLED | UNKNOWN
  string ord_status = 7;
  string symbol = 8;
  string side = 9;                      // BUY | SELL
  double order_qty = 10;
  double price = 11;
  double last_qty = 12;                 // this fill
  double last_px = 13;
  double leaves_qty = 14;
  double cum_qty = 15;                  // the order so far
  double avg_px = 16;
  string reject_text = 17;
  int32  ord_rej_reason = 18;
  string secondary_cl_ord_id = 19;
  int64  occurred_at_epoch_ms = 20;
  bool   terminal = 21;
  string raw_fix = 22;                  // verbatim FIX message, for the audit trail
}

message StreamExecutionReportsRequest {
  // Replay what the journal still holds from this instant before switching to
  // live delivery, so a reconnecting subscriber does not lose the gap.
  // 0 = live reports only.
  int64 since_epoch_ms = 1;
}

message GetOrderExecutionsRequest {
  string cl_ord_id = 1;
}

message GetOrderExecutionsResponse {
  bool   success = 1;
  repeated ExecutionReport reports = 2;
  string error_code = 3;
  string error_message = 4;
}

message EnsureSessionRequest {
  LpSessionSpec session = 1;
}

message SessionStatusRequest {
  string lp_account_id = 1;
}

message CloseSessionRequest {
  string lp_account_id = 1;
}

message SessionStatusResponse {
  bool   success = 1;
  string lp_account_id = 2;
  string state = 3;                     // ABSENT | CONNECTING | LOGGED_ON | FAILED
  string session_id = 4;                // QuickFIX SessionID string, if any
  string spec_fingerprint = 5;
  int64  logged_on_at_epoch_ms = 6;
  int64  last_used_at_epoch_ms = 7;
  string error_code = 8;
  string error_message = 9;
}
